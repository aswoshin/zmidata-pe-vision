<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卓觅识界</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="brand"><span class="whale" aria-hidden="true"><img src="brand.svg" alt=""></span><div><strong>卓觅识界</strong><small>zmidata · PE 视觉助手</small></div></div><button id="close" class="icon" aria-label="收起">×</button></header>
<nav><button data-view="recognize" class="active">识别</button><button data-view="settings">设置</button></nav>
<main><div id="notice" role="status"></div><section id="recognize" class="view">
<div class="intro"><span class="eyebrow">看懂每一帧</span><h1 id="mode-title">视频里，是哪个 IP？</h1><p id="mode-caption">动漫角色 · 品牌 IP · 作品归属</p></div>
<div class="mode-switch" role="group" aria-label="识别模式"><button type="button" data-mode="ip" aria-pressed="true">IP 识别</button><button type="button" data-mode="text" aria-pressed="false">文字检查</button></div>
<div class="card task"><div class="row spread"><span class="label">当前题包</span><button id="load" class="text-button">↻ 刷新</button></div><strong id="task-name">正在读取题包…</strong><small id="task-meta"></small></div>
<div class="card controls"><label class="row spread"><span>抽帧间隔</span><select id="sample-step" aria-label="抽帧间隔"><option value="20">每 20% · 6 帧</option><option value="10">每 10% · 11 帧</option><option value="5">每 5% · 21 帧</option><option value="25">每 25% · 5 帧</option></select></label><div id="sample-dots" class="sample-dots" aria-hidden="true"></div><div id="enhance-control" class="row spread"><label for="enhance"><strong>联网增强</strong><small>视觉 + 联网并行，统一结果与置信度</small></label><input id="enhance" type="checkbox" role="switch" aria-label="联网增强"></div><p id="text-mode-hint" class="help" hidden>检查抽样画面中的完整度、乱码和错字；小字可切换每 5% 抽帧。</p><p id="model-line" class="help"></p><button id="start" class="primary wide">识别全部题 <span aria-hidden="true">↗</span></button><button id="stop" class="wide stop" hidden>停止识别</button><p class="footnote">置信度为模型估计，结果自动显示在评分下方。</p></div>
<div class="row spread section-head"><h2>识别结果 <span id="counts">0 / 0</span></h2><button id="retry" class="text-button" hidden>重试失败项</button></div><div class="progress" aria-label="识别进度"><div id="progress"></div></div><p id="run-state" class="help" role="status"></p><div id="items"></div>
</section><section id="settings" class="view" hidden><div id="settings-slot"></div></section></main><footer>zmidata.卓觅数据 © 2026 · MIT 开源协议</footer><script type="module" src="app.js"></script></body></html>
